<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: a bathroom smart mirror. a thin black frame around grey glass; small white readouts sit in the corners (time, forms, whose words, kept),
     the poem surfaces in the middle, and the one thing you type rests on the counter underneath.
     zoomed out so the whole vanity shows: lavender tile, the mirror, a sink with plants and soap, the counter. single visual world in Katelin's site palette; edges are hard and type is crisp */
  --wall:#f2f1f9; --grout:#e1dff6; --counter:#ffffff; --counter-edge:#cdc9ee; --ink:#1e1a3c; --muted:#5f5a85; --line:#cdc9ee;
  --frame:#1e1a3c; --glass-ink:#ffffff; --glass-dim:rgba(255,255,255,.84); --glass-line:rgba(255,255,255,.6);
  --accent:#7d6deb; --accent-ink:#ffffff;
  --orange:#f8901b; --pink:#fa89b3; --green:#51c695; --blue:#57b1f1; --blood:#e9734b; --lav:#b9aefc;
  --poem:18px;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);font:400 15px/1.55 var(--body);display:flex;flex-direction:column;overflow:hidden;
  background-color:var(--wall);
  background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);
  background-size:100% 96px,192px 100%}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#glass :focus-visible{outline-color:#fff}
[hidden]{display:none !important}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.col{width:100%;max-width:860px;margin:0 auto;padding:0 28px}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 22px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.45;cursor:default}

/* ---------- the mirror ---------- */
#stage{flex:1;min-height:0;display:flex;padding-top:26px}
#stage .col{display:flex;min-height:0}
#vanity{flex:1;min-height:0;display:flex;background:var(--frame);padding:6px;border-radius:2px;box-shadow:10px 12px 0 -2px rgba(125,109,235,.22)}
#glass{position:relative;flex:1;min-height:0;overflow:hidden;color:var(--glass-ink);font-weight:400;
  background:
    linear-gradient(115deg,transparent 52%,rgba(255,255,255,.08) 52.1%,rgba(255,255,255,.08) 77.9%,transparent 78%),
    linear-gradient(160deg,#6c5ddb 0%,#5648c0 42%,#3d3392 100%)}
#vanity.lit #glass{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(1.07)}}
#glass .linkbtn{color:var(--glass-dim)}
#glass .linkbtn:hover{color:#fff}

/* corner readouts */
#when{position:absolute;top:22px;left:26px;z-index:2}
#clock{font-size:30px;line-height:1.05;font-weight:500;letter-spacing:-.01em;display:block}
#date{display:block;font-size:13px;color:var(--glass-dim);border-top:1px solid var(--glass-line);margin-top:5px;padding-top:4px}
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
#hud > *{pointer-events:auto}
.widget{position:absolute;font-size:13px}
.widget h3{font:400 13px/1.3 var(--body);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--glass-line);color:var(--glass-dim)}
#w-forms{left:26px;top:122px;width:150px}
#forms{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
#forms button{background:none;border:0;padding:0;color:var(--glass-dim);font-weight:400;display:flex;align-items:center;gap:9px}
#forms button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange);flex:none}
#forms button[data-id="page"]::before{background:var(--lav)}
#forms button[data-id="cento"]::before{background:var(--pink)}
#forms button[data-id="erasure"]::before{background:var(--blue)}
#forms button[data-id="travesty"]::before{background:var(--green)}
#forms button[data-id="cutup"]::before{background:var(--blood)}
#forms button[aria-pressed="true"]{color:#fff;font-weight:600}
#forms button[aria-pressed="true"]::before{box-shadow:0 0 0 2px #3d3392,0 0 0 4px #fff}
#w-voice{right:26px;top:22px;width:150px;text-align:right}
#voice{background:transparent;border:0;color:#fff;font-weight:500;font-size:18px;text-align:right;padding:0;cursor:pointer;max-width:100%}
#voice option,#hand option{color:#222}
#hand{background:transparent;border:0;color:#fff;font-weight:500;font-size:15px;text-align:right;padding:0;cursor:pointer;max-width:100%}
#w-voice h3+select{margin-bottom:12px}
#w-size{right:30px;top:42%;height:110px;display:flex}
#size{writing-mode:vertical-lr;direction:rtl;width:18px;height:110px;accent-color:#fff}
#w-kept{left:26px;bottom:20px;display:flex;gap:18px}
#w-key{right:26px;bottom:18px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;color:var(--glass-dim);font-size:12px}
#w-key label{display:flex;gap:6px;align-items:center}
#w-key input[type=password],#w-key input[type=text]{background:rgba(255,255,255,.14);border:1px solid var(--glass-line);border-radius:999px;padding:1px 10px;width:140px;color:#fff;font-family:var(--mono);font-size:11.5px}
#w-key input::placeholder{color:var(--glass-dim)}

/* landing, in the glass */
#landing{position:absolute;inset:0;display:grid;place-items:center;padding:24px;overflow:auto}
#drop{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 26px;border:1.5px dashed transparent;border-radius:18px;max-width:420px}
#drop.over{border-color:#fff;background:rgba(255,255,255,.1)}
#drop h2{font:500 clamp(24px,5vw,34px)/1.12 var(--body);letter-spacing:-.01em;margin:0;text-wrap:balance}
#drop p{margin:0;color:var(--glass-dim)}
#pick{background:#fff;color:var(--ink)}
#progress{width:220px}
#bar{height:4px;background:var(--glass-line);border-radius:999px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s}
#ptxt{color:var(--glass-dim);margin-top:8px}
#loaderr{color:#ffd9a6;font-weight:500}
.fine{font-size:12.5px}

/* the poem, in the middle of the glass */
#log{position:absolute;inset:0;overflow:auto;padding:30px 200px 60px}
#msgs{display:flex;flex-direction:column;gap:10px;max-width:480px;margin:0 auto}
.me{align-self:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#fff;margin-top:30px;overflow-wrap:anywhere;text-align:center;font-weight:600}
.book{display:block}
.face{display:none}
.page{min-width:0}
.page.note{text-align:center;font-size:26px;font-weight:500;letter-spacing:-.01em;line-height:1.3;white-space:pre-line;padding-top:18vh}
.tagline{display:flex;justify-content:center;margin-bottom:14px}
.form{font-size:11.5px;display:flex;align-items:center;gap:7px;color:var(--glass-dim)}
.form::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}
.form.f-page::before{background:var(--lav)}.form.f-cento::before{background:var(--pink)}.form.f-erasure::before{background:var(--blue)}.form.f-travesty::before{background:var(--green)}.form.f-cutup::before{background:var(--blood)}
.poem{font:400 var(--poem)/1.65 var(--display);white-space:pre-wrap;overflow-wrap:anywhere;margin:0;animation:surface 1.4s ease-out}
@keyframes surface{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.status{color:var(--glass-dim);font-size:13px;text-align:center}
.status.err{color:#ffd9a6}
.under{margin-top:16px;display:flex;flex-direction:column;gap:6px;color:var(--glass-dim);font-size:12.5px}
.under .row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.under details summary{cursor:pointer}
.under details div{line-height:1.7}
.check{color:#ffd9a6}
.keep[aria-pressed="true"]{color:#fff !important;text-decoration:none;font-weight:500}

/* kept poems, in the glass */
#kept{position:absolute;inset:0;z-index:3;overflow:auto;padding:40px 26px 24px;background:#4a3fa8}
#kept .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#kept input{background:transparent;border:0;border-bottom:1px solid var(--glass-line);color:#fff;padding:4px 0;width:100%}
#btitle{font-size:26px;font-weight:500}
#kept input::placeholder{color:var(--glass-dim)}
#klist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
#klist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--glass-line)}
#klist b{font-size:11.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--glass-dim)}
#klist span{grid-column:1;font-family:var(--display);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#klist button{grid-row:1 / 3;grid-column:2;align-self:center}
#kempty{color:var(--glass-dim);margin:0}
.kacts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
#savedoc{background:#fff;color:var(--ink)}
#kmsg{color:#ffd9a6;flex-basis:100%}

/* ---------- the vanity under the mirror ---------- */
#scene{display:block;width:100%;max-width:1000px;height:auto;margin:0 auto}
#counter{background:var(--counter);border-top:2px solid var(--frame);min-height:78px;display:grid;align-items:center}
#app{padding:0}
#composer{padding:14px 0 16px}
.ask{display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto}
#q{flex:1;min-width:0;height:46px;padding:0 20px;background:var(--wall);border:1.5px solid var(--frame);border-radius:999px}
#q:focus{outline:none;box-shadow:0 0 0 3px rgba(125,109,235,.35)}
#go{width:46px;height:46px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--orange);color:var(--ink);border:1.5px solid var(--frame)}
#go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:760px){
  #stage{padding-top:14px}.col{padding:0 14px}
  #when{top:14px;left:16px}#clock{font-size:20px}#date{font-size:12px}
  #w-voice{top:14px;right:16px}#w-voice h3{display:none}#voice,#hand{font-size:14px;display:block;margin:0 0 2px auto}
  #w-forms{left:16px;right:16px;top:74px;width:auto}#w-forms h3{display:none}
  #forms{flex-direction:row;flex-wrap:wrap;gap:6px 14px}
  #w-size{display:none}
  #w-kept{left:10px;bottom:8px;background:#3d3392;padding:3px 10px;border-radius:999px}
  #w-key{right:16px;bottom:10px}#w-key input[type=password],#w-key input[type=text]{width:96px}
  #log{padding:128px 20px 64px}
  .page.note{padding-top:12vh;font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<div id="stage"><div class="col">
  <div id="vanity">
    <div id="glass">
      <div id="when"><span id="clock"></span><span id="date"></span></div>
      <section id="landing">
        <div id="drop">
          <h2>Lay your archive here.</h2>
          <button class="primary" id="pick">choose a file</button>
          <input type="file" id="file" multiple hidden>
          <p>Then you get poems from your words.</p>
          <div id="progress" hidden><div id="bar"><i></i></div><div id="ptxt" class="mono"></div></div>
          <div id="loaderr" hidden></div>
          <p class="fine">It stays in this browser. Every form works without a key. Add one and Claude can arrange some of them.</p>
        </div>
      </section>
      <div id="log" hidden><div id="msgs"></div></div>
      <div id="hud" hidden>
        <div class="widget" id="w-forms"><h3>Forms</h3><div id="forms" role="group" aria-label="Poetic form"></div></div>
        <div class="widget" id="w-voice"><h3 id="voiceH">Words</h3><select id="voice" aria-label="Whose words"><option value="0">mine</option><option value="1" id="voiceA">its</option><option value="">both</option></select><h3>Hand</h3><select id="hand" aria-label="Who arranges the poem"><option value="auto">Claude, if here</option><option value="archive">archive only</option></select></div>
        <div class="widget" id="w-size"><input type="range" id="size" min="14" max="26" value="18" aria-label="Poem text size"></div>
        <div class="widget" id="w-kept"><button class="linkbtn" id="kopen" type="button">kept (0)</button><button class="linkbtn" id="reset" type="button">new archive</button></div>
        <div class="widget" id="w-key"><label for="key">key <input type="password" id="key" placeholder="sk-ant-…" autocomplete="off" spellcheck="false"></label>
          <label for="model">model <input type="text" id="model" value="claude-sonnet-5-5" spellcheck="false"></label>
          <label for="keep"><input type="checkbox" id="keep"> remember</label></div>
      </div>
      <section id="kept" hidden><div class="in">
        <input type="text" id="btitle" value="Chatbook" aria-label="Title of the book">
        <input type="text" id="bauthor" placeholder="your name" aria-label="Author">
        <p id="kempty">Nothing kept yet. Press keep under a poem.</p>
        <ol id="klist"></ol>
        <div class="kacts">
          <button class="primary" id="savedoc" type="button">save as document</button>
          <button class="linkbtn" id="copyall" type="button">copy all</button>
          <button class="linkbtn" id="kclose" type="button">back to the mirror</button>
          <span id="kmsg"></span>
        </div>
      </div></section>
    </div>
  </div>
</div></div>

<svg id="scene" viewBox="0 0 1000 124" aria-hidden="true">
  <g fill="#f8901b" stroke="#1e1a3c" stroke-width="2"><rect x="150" y="78" width="46" height="46"/><rect x="204" y="96" width="54" height="28" fill="#fa89b3"/></g>
  <g stroke="#1e1a3c" stroke-width="2" fill="#cdc9ee"><rect x="168" y="58" width="10" height="20"/><path d="M160 58h30v-8h-18z"/></g>
  <g stroke="#1e1a3c" stroke-width="2"><path d="M492 14h16v58h-16z" fill="#cdc9ee"/><path d="M484 6h32v10h-32z" fill="#e1dff6"/><path d="M340 72h320l-22 44q-4 8-14 8H376q-10 0-14-8z" fill="#fff"/><path d="M340 72h320" stroke-width="3"/></g>
  <circle cx="500" cy="86" r="5" fill="#1e1a3c"/>
  <g fill="#51c695" stroke="#1e1a3c" stroke-width="2"><circle cx="752" cy="66" r="15"/><circle cx="778" cy="58" r="18"/><circle cx="800" cy="70" r="14"/><circle cx="766" cy="78" r="13"/><circle cx="846" cy="64" r="16"/><circle cx="870" cy="54" r="17"/><circle cx="890" cy="68" r="14"/><circle cx="862" cy="76" r="13"/></g>
  <g fill="#1e1a3c"><path d="M752 86h50l-5 38h-40z"/><path d="M846 86h48l-5 38h-38z"/></g>
</svg>
<div id="counter">
<main id="app" hidden>
  <form id="composer"><div class="col">
    <div class="ask">
      <input type="text" id="q" placeholder="say a word…" aria-label="A word for the poem" autocomplete="off">
      <button class="primary" id="go" type="submit" aria-label="Write the poem"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div></form>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script id="worker-src" type="text/plain">
'use strict';
var K1 = 1.4, B = 0.75, MAXC = 1200;
var STOP = new Set(("a an the and or but if then else of to in on at by for with from as is are was were be been being am do does did doing have has had having " +

  "not no nor so than too very can could should would will shall may might must just also about into over under again more most some any each other such only own same both few all out up down off " +
  "ll re ve don didn doesn isn aren wasn weren won wouldn couldn shouldn hasn haven hadn im ive id like get got really yeah ok okay").split(' '));
var C = null;

var stemCache = new Map();
function undouble(s) { var n = s.length; return (n > 2 && s[n - 1] === s[n - 2] && 'lsz'.indexOf(s[n - 1]) < 0) ? s.slice(0, -1) : s; }

  var s = stemCache.get(w); if (s !== undefined) return s;

    var w = raw.toLowerCase(); if (STOP.has(w)) continue;
    fn(stem(w), m.index, raw.length);
  }
}

/* ---------- corpus sink ---------- */
function newSink() {
  return {
    convs: [], turns: [], labels: [], labelIx: new Map(), transcript: false,
    conv: function (title, file) { this.convs.push({ title: title || '', file: file }); return this.convs.length - 1; },
    label: function (l) { var i = this.labelIx.get(l); if (i === undefined) { i = this.labels.length; this.labels.push(l); this.labelIx.set(l, i); } return i; },

  };
}
function roleOf(r) {
  r = String(r == null ? '' : r).toLowerCase().trim();

function isMsg(o) { return o && typeof o === 'object' && !Array.isArray(o) && (o.content != null || o.text != null || o.message != null || o.value != null || o.body != null); }
function addMsgs(sink, ci, arr) {
  for (var i = 0; i < arr.length; i++) { var m = arr[i]; if (!isMsg(m)) continue; var raw = msgRole(m), r = raw == null ? 2 : roleOf(raw); if (/^(system|tool)$/i.test(String(raw))) continue; sink.turn(ci, r, nice(raw, r), msgText(m)); }
}
function addObj(sink, o, file, loose) {
  if (!o || typeof o !== 'object') return;

    if (o.length && o.every(function (x) { return isMsg(x) && !x.mapping && !x.chat_messages && !Array.isArray(x.messages); })) {
      var groups = new Map();
      for (var i = 0; i < o.length; i++) { var key = o[i].conversation_id || o[i].conversation || o[i].conversation_title || o[i].title || file; var ci = groups.get(key); if (ci === undefined) { ci = sink.conv(key === file ? '' : String(key), file); groups.set(key, ci); } addMsgs(sink, ci, [o[i]]); }
    } else for (var j = 0; j < o.length; j++) addObj(sink, o[j], file);
    return;
  }

  if (o.mapping && typeof o.mapping === 'object') {
    var map = o.mapping, ids = [], cur = o.current_node, seen = new Set();
    if (cur && map[cur]) { while (cur && map[cur] && !seen.has(cur)) { seen.add(cur); ids.push(cur); cur = map[cur].parent; } ids.reverse(); }
    else ids = Object.keys(map).sort(function (a, b) { return ((map[a].message && map[a].message.create_time) || 0) - ((map[b].message && map[b].message.create_time) || 0); });
    var c1 = sink.conv(title, file);
    for (var k = 0; k < ids.length; k++) {
      var m = map[ids[k]].message; if (!m || !m.author) continue; var r = m.author.role;

      keep.setAttribute('aria-pressed', String(on)); keep.textContent = on ? '♥ kept' : 'keep'; saveKept();
    };
    var again = document.createElement('button'); again.type = 'button'; again.className = 'linkbtn'; again.textContent = 'again';
    again.onclick = function () { if (!busy) compose(ex.q, ex.form, ex.role); };
    var cp = document.createElement('button'); cp.type = 'button'; cp.className = 'linkbtn'; cp.textContent = 'copy';
    cp.onclick = function () { try { navigator.clipboard.writeText(ex.text).then(function () { cp.textContent = 'copied'; }, function () { cp.textContent = 'copy blocked here'; }); } catch (e) { cp.textContent = 'copy blocked here'; } };
    row.appendChild(keep); row.appendChild(again); row.appendChild(cp);
    var det = document.createElement('details'), sum = document.createElement('summary'), list = document.createElement('div');
    sum.textContent = 'citations';
    cites(ex).forEach(function (c) { var d = document.createElement('div'); d.textContent = c; list.appendChild(d); });
    det.appendChild(sum); det.appendChild(list); row.appendChild(det);
    under.appendChild(row);
    var check = document.createElement('span'); check.className = 'check'; check.hidden = true; under.appendChild(check);
    ex.page.appendChild(under); scrollLog();
    if (!ex.byModel) return;
    var words = Array.from(new Set(ex.text.match(/[\p{L}\p{N}]+/gu) || []));
    call('vocab', { words: words, scaffold: ex.form === 'definition' }).then(function (r) {
      if (!r.missing.length) return;
      check.textContent = 'not from the archive: ' + r.missing.slice(0, 12).join(', ') + (r.missing.length > 12 ? '…' : ''); check.hidden = false; scrollLog();
    }).catch(function () {});
  }

  /* ---------- kept poems and the document ---------- */
  var kept = [];
  try { kept = JSON.parse(localStorage.getItem('chatbook-kept') || '[]') || []; $('btitle').value = localStorage.getItem('chatbook-title') || 'Chatbook'; $('bauthor').value = localStorage.getItem('chatbook-author') || ''; } catch (e) { kept = []; }
  function saveKept() {
    $('kopen').textContent = 'kept (' + kept.length + ')';
    try { localStorage.setItem('chatbook-kept', JSON.stringify(kept)); localStorage.setItem('chatbook-title', $('btitle').value); localStorage.setItem('chatbook-author', $('bauthor').value); } catch (e) {}
    if (!$('kept').hidden) drawKept();
  }
  function drawKept() {
    var l = $('klist'); l.textContent = ''; $('kempty').hidden = kept.length > 0; $('savedoc').disabled = !kept.length; $('kmsg').textContent = '';
    kept.forEach(function (k) {
      var li = document.createElement('li'), b = document.createElement('b'), sp = document.createElement('span'), x = document.createElement('button');
      b.textContent = k.q + ' · ' + k.form; sp.textContent = k.text.split('\n').filter(function (t) { return t.trim(); })[0] || '';
      x.type = 'button'; x.className = 'linkbtn'; x.textContent = 'remove'; x.onclick = function () { kept = kept.filter(function (o) { return o.id !== k.id; }); saveKept(); };
      li.appendChild(b); li.appendChild(x); li.appendChild(sp); l.appendChild(li);
    });
  }
  $('kopen').onclick = function () { $('kept').hidden = false; drawKept(); };
  $('kclose').onclick = function () { $('kept').hidden = true; };
  ['btitle', 'bauthor'].forEach(function (id) { $(id).addEventListener('change', saveKept); });
  function allText() {
    return kept.map(function (k) { return k.text + '\n\nCitations:\n' + k.cites.join('\n'); }).join('\n\n\n—\n\n\n');
  }
  $('copyall').onclick = function () { try { navigator.clipboard.writeText(allText()).then(function () { $('kmsg').textContent = 'copied'; }, function () { $('kmsg').textContent = 'copy is blocked here'; }); } catch (e) { $('kmsg').textContent = 'copy is blocked here'; } };
  function xml(t) { return String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function para(text, o) {
    o = o || {};
    var ppr = (o.breakBefore ? '<w:pageBreakBefore/>' : '') + '<w:spacing w:before="' + (o.before || 0) + '" w:after="0" w:line="320" w:lineRule="auto"/>' + (o.center ? '<w:jc w:val="center"/>' : '');
    var rpr = '<w:rFonts w:ascii="Georgia" w:hAnsi="Georgia" w:cs="Georgia"/>' + (o.bold ? '<w:b/>' : '') + (o.italic ? '<w:i/>' : '') + '<w:sz w:val="' + (o.size || 24) + '"/>';
    return '<w:p><w:pPr>' + ppr + '</w:pPr>' + (text ? '<w:r><w:rPr>' + rpr + '</w:rPr><w:t xml:space="preserve">' + xml(text) + '</w:t></w:r>' : '') + '</w:p>';
  }
  function buildDocx() {
    var W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
    var title = $('btitle').value.trim() || 'Chatbook', author = $('bauthor').value.trim(), body = '';
    body += para(title, { center: true, bold: true, size: 56, before: 4200 });
    if (author) body += para(author, { center: true, size: 28, before: 360 });
    body += para('Table of Contents', { breakBefore: true, bold: true, size: 28 }) + para('');
    kept.forEach(function (k, i) { body += para((i + 1) + '.  ' + k.q + ' (' + k.form + ')'); });
    kept.forEach(function (k) {
      k.text.split('\n').forEach(function (line, i) { body += para(line, { breakBefore: i === 0 }); });
      body += para('') + para('') + para('Citations:', { size: 20 });
      k.cites.forEach(function (c) { body += para(c, { size: 20 }); });
    });
    body += '<w:sectPr><w:footerReference w:type="default" r:id="rId1"/><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>';
    var zip = new JSZip(), H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    zip.file('[Content_Types].xml', H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>');
    zip.file('_rels/.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    zip.file('word/_rels/document.xml.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>');
    zip.file('word/footer1.xml', H + '<w:ftr ' + W + '><w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>');
    zip.file('word/document.xml', H + '<w:document ' + W + '><w:body>' + body + '</w:body></w:document>');
    return zip.generateAsync({ type: 'blob' });
  }
  function saveFile(name, blob) {
    var hosted = window.claude && typeof window.claude.use === 'function';
    return (hosted ? window.claude.use('downloads') : Promise.resolve(null)).then(function (d) {
      if (d) return d.save({ filename: name, data: blob });
      if (hosted) throw { code: 'unavailable' };
      var a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    });
  }
  $('savedoc').onclick = function () {
    if (!kept.length) return;
    if (typeof JSZip === 'undefined') { $('kmsg').textContent = 'The document builder did not load. Check your connection, or use copy all.'; return; }
    var name = ($('btitle').value.trim() || 'Chatbook').replace(/[^\p{L}\p{N} _-]+/gu, '').trim().replace(/\s+/g, '-') || 'Chatbook';
    $('kmsg').textContent = '· · ·';
    buildDocx().then(function (blob) { return saveFile(name + '.docx', blob); }).then(function () { $('kmsg').textContent = 'saved'; }, function (err) {
      var c = err && err.code; $('kmsg').textContent = c === 'declined' ? '' : c === 'rate_limited' ? 'A save is already open. Try again in a moment.' : 'Saving a file is not possible in this view. Use copy all.';
    });
  };
  saveKept();
  function tick() { var d = new Date(); $('clock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase(); $('date').textContent = d.toLocaleDateString([], { month: 'long', day: 'numeric' }) + ', ' + d.toLocaleDateString([], { weekday: 'long' }); }
  function greeting() { var h = new Date().getHours(), g = h < 5 ? 'good night' : h < 12 ? 'good morning' : h < 18 ? 'good afternoon' : 'good evening', nm = $('bauthor').value.trim().split(/\s+/)[0]; return g + (nm ? ' ' + nm : '') + '!\nsay a word.'; }
  $('size').oninput = function () { document.documentElement.style.setProperty('--poem', this.value + 'px'); };
  tick(); setInterval(tick, 20000);

  function compose(q, formId, role) {
    var f = formOf(formId), ex = { q: q, form: formId, role: role, hits: [], text: '' };
    Array.prototype.forEach.call($('msgs').querySelectorAll('.page.note'), function (x) { x.parentNode.remove(); });
    var me = document.createElement('div'); me.className = 'me'; me.textContent = q; $('msgs').appendChild(me);
    ex.page = bookRow();
    var tl = document.createElement('div'); tl.className = 'tagline'; var chip = document.createElement('span'); chip.className = 'form f-' + formId; chip.textContent = f.name.toLowerCase(); tl.appendChild(chip);
    ex.poemEl = document.createElement('p'); ex.poemEl.className = 'poem';
    ex.statusEl = document.createElement('div'); ex.statusEl.className = 'status';
    ex.page.appendChild(tl); ex.page.appendChild(ex.poemEl); ex.page.appendChild(ex.statusEl);
    ctrl = new AbortController(); var my = ctrl; setBusy(true); status(ex, '\u00b7 \u00b7 \u00b7'); scrollLog();
    var wantModel = f.model && $('hand').value !== 'archive';
    var modelP = wantModel ? getSample() : Promise.resolve(null);
    modelP.then(function (s) {
      ex.sample = s; ex.byModel = !!(f.model && s);
      if (f.model && !s) chip.textContent = f.name.toLowerCase() + ' \u00b7 archive';
      if (!s) return [];
      status(ex, '\u00b7 \u00b7 \u00b7');
      return expandQuery(q, s, my.signal).catch(function () { return []; });
    }).then(function (extra) {
      if (my.signal.aborted) throw { code: 'aborted' };
      return call('search', { query: q, extra: extra, role: formId === 'page' && corpus.transcript ? 0 : role, k: ex.byModel ? 14 : 40 });
    }).then(function (res) {
      ex.hits = res.hits;
      if (!res.hits.length) { status(ex, 'Nothing there. Try another word.'); return; }
      if (formId === 'page') return makePage(ex, res.hits, q).then(function (t) { ex.text = t; if (!t) { status(ex, 'No chat excerpt matched to set on a page. Try another word.'); return; } ex.poemEl.textContent = t; status(ex, ''); finishPoem(ex); });
      if (f.model && !ex.byModel) {
        var made = formId === 'cento' ? centoA(res.hits, q) : formId === 'erasure' ? erasureA(res.hits, q) : definitionA(res.hits, q);
        if (!made || !made.text) { status(ex, 'Too little text matched to make this one. Try another word.'); return; }
        ex.text = made.text; ex.hits = made.hits; ex.poemEl.textContent = ex.text; status(ex, ''); finishPoem(ex); return;
      }
      if (!f.model) {
        var texts = res.hits.map(function (h) { return h.text; });
        ex.text = formId === 'travesty' ? travesty(texts, q) : cutup(texts, q);
        if (!ex.text) { status(ex, 'Too little text matched to cut a poem from. Try another word.'); return; }
        ex.poemEl.textContent = ex.text; status(ex, ''); ex.hits = res.hits.slice(0, 12); finishPoem(ex); return;
      }
      status(ex, '\u00b7 \u00b7 \u00b7');
      return ex.sample([{ role: 'user', content: buildPrompt(ex) }], { signal: my.signal, cache: false, onText: function (o) { if (my.signal.aborted || !o.text) return; status(ex, ''); ex.text = tidy(o.text); ex.poemEl.textContent = ex.text; scrollLog(); } }).then(function (r) {
        ex.text = tidy(r.text || ex.text); ex.poemEl.textContent = ex.text; status(ex, r.truncated ? 'cut off at the length limit' : ''); finishPoem(ex);
      });
    }).catch(function (err) {
      var code = err && err.code;
      if (my.signal.aborted || code === 'aborted') { status(ex, 'stopped'); if (ex.text) finishPoem(ex); return; }
      if (code === 'no_model') return status(ex, NO_MODEL, true);
      if (code === 'rate_limited') return status(ex, 'Claude is rate limited right now. Try again in a minute, or use Travesty or Cut-up.', true);
      if (code === 'not_granted') return status(ex, 'Claude was not allowed to write on this page. Travesty and Cut-up still work.', true);
      status(ex, 'The poem could not be written' + (err && err.message ? ' (' + err.message + ')' : '') + '.', true);
    }).then(function () { if (ctrl === my) setBusy(false); scrollLog(); });
  }
  $('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) { if (ctrl) ctrl.abort(); return; }
    var q = $('q').value.trim(); if (!q || !corpus) return;
    $('q').value = ''; var v = $('voice').value; compose(q, form, v === '' ? null : Number(v));
  });
})();
</script>
